name: Clang Format, Tidy & Static Analysis

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy bear

      - name: Find source files
        id: files
        run: |
          FILES=$(find . -type f \( -name "*.c" -o -name "*.h" \) -not -path "./build/*")
          echo "$FILES"
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run clang-format (auto-fix, 4-space indent, sorted includes)
        run: |
          echo "${{ steps.files.outputs.files }}" | xargs clang-format -i -style=file

      - name: Generate compile_commands.json
        run: bear -- make

      - name: Run clang-tidy (auto-fix, removes unused includes)
        run: |
          echo "${{ steps.files.outputs.files }}" | xargs clang-tidy -p . --fix --fix-errors

      - name: Commit fixes if any
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format and clean up includes [skip ci]"

      - name: Fail PR if formatting/lint changes are needed
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Formatting or include-cleanup changes are needed. Run clang-format/clang-tidy locally and push again."
            git diff
            exit 1
          fi

  static-analysis:
    runs-on: ubuntu-latest
    needs: format-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang static analyzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools

      - name: Run clang static analyzer
        run: |
          scan-build --status-bugs make
